name: Publish Docker image
on:
  release:
    types: [ published ]
jobs:
  upload_jar:
    name: Build and attach JAR to release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '8'
      - name: Build shadow JAR
        run: ./gradlew shadowJar
      - name: Upload JAR to release
        uses: softprops/action-gh-release@v1
        with:
          files: build/libs/md-test-spec2excel-*.jar
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER_ID }}
          password: ${{ secrets.DOCKER_ACCESS_KEY }}
      - name: Push to Docker Hub(specified version)
        uses: docker/build-push-action@v3
        with:
          file: ./docker/Dockerfile
          push: true
          tags: kazuki0529/md-test-spec2excel:${{ github.event.release.tag_name }}
      - name: Push to Docker Hub(latest)
        uses: docker/build-push-action@v3
        with:
          file: ./docker/Dockerfile
          push: true
          tags: kazuki0529/md-test-spec2excel:latest
